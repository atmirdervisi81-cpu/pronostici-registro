<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Registro pronostici</title>
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--ink:#16181d;--muted:#667085;--line:#e4e7ec;
  --accent:#1f6feb;--ok:#13804b;--ko:#c4320a;--warn:#b54708;
  --c1:#1f6feb;--cx:#98a2b3;--c2:#e8590c;--chip:#eef2f7;
  --radius:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--card:#171a21;--ink:#e6e8ec;--muted:#98a2b3;--line:#2a2f3a;
  --accent:#58a6ff;--ok:#3fb950;--ko:#f47067;--warn:#e3b341;
  --c1:#58a6ff;--cx:#6e7681;--c2:#ff922b;--chip:#222733;}}
:root[data-theme="dark"]{
  --bg:#0f1115;--card:#171a21;--ink:#e6e8ec;--muted:#98a2b3;--line:#2a2f3a;
  --accent:#58a6ff;--ok:#3fb950;--ko:#f47067;--warn:#e3b341;
  --c1:#58a6ff;--cx:#6e7681;--c2:#ff922b;--chip:#222733;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding:12px 16px 0}
h1{font-size:18px;margin:0 0 2px}
.sub{color:var(--muted);font-size:12px}
nav{display:flex;gap:4px;margin-top:10px}
nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;
  padding:10px 4px;border-bottom:2px solid transparent;cursor:pointer}
nav button.on{color:var(--ink);border-color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:12px 16px 60px}
.filtri{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filtri select,.filtri input{font:inherit;padding:8px 10px;border:1px solid var(--line);
  border-radius:8px;background:var(--card);color:var(--ink);flex:1 1 140px;min-width:0}
.filtri label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.giorno{font-weight:700;margin:18px 0 8px;color:var(--muted);font-size:13px;text-transform:uppercase;
  letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:10px}
.riga1{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px}
.squadre{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0 10px;
  font-weight:650;font-size:16px}
.squadre span:last-child{text-align:right}
.ris{font-variant-numeric:tabular-nums;font-size:18px;padding:0 6px}
.barra{display:flex;height:22px;border-radius:6px;overflow:hidden;font-size:11px;font-weight:700;color:#fff}
.barra div{display:flex;align-items:center;justify-content:center;min-width:28px}
.b1{background:var(--c1)}.bx{background:var(--cx)}.b2{background:var(--c2)}
.mercati{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--chip);border-radius:999px;padding:4px 10px;font-size:13px;white-space:nowrap}
.chip b{font-weight:700}
.chip.ok{outline:2px solid var(--ok)}.chip.ko{outline:2px solid var(--ko)}
.chip.dim{opacity:.7}
.avviso{color:var(--warn);font-size:12px;margin-top:8px}
.azioni{margin-top:10px;display:flex;justify-content:flex-end}
.azioni button,.form button{font:inherit;font-size:13px;border:1px solid var(--line);background:none;
  color:var(--accent);border-radius:8px;padding:6px 10px;cursor:pointer}
.commenti{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.com{font-size:14px;margin-bottom:8px}
.com .meta{color:var(--muted);font-size:12px}
.form{display:grid;gap:8px;grid-template-columns:1fr 1fr 1fr}
.form select,.form textarea{font:inherit;font-size:14px;padding:7px;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
.form textarea{grid-column:1/-1;min-height:70px;resize:vertical}
.form button{grid-column:1/-1;background:var(--accent);color:#fff;border:0;padding:9px}
.vuoto,.errore{text-align:center;color:var(--muted);padding:40px 10px}
.errore{color:var(--ko)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
h2{font-size:16px;margin:18px 0 6px}
.nota{color:var(--muted);font-size:13px}
@media (max-width:480px){.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Registro pronostici</h1>
  <div class="sub" id="stato">Caricamento…</div>
  <nav>
    <button data-vista="prossime" class="on">Prossime</button>
    <button data-vista="risultati">Risultati</button>
    <button data-vista="bilancio">Bilancio</button>
  </nav>
</header>
<main id="main"></main>

<script>
const SUPABASE_URL = "https://skigewaungewkzdektws.supabase.co";
const CHIAVE_PUBBLICA = "sb_publishable_qE_n8XHRWM7e7g3fzUxQdA_3-y8lg3W";

const COMPETIZIONI = {
  E0:"Premier League",E1:"Championship",E2:"League One",E3:"League Two",I1:"Serie A",I2:"Serie B",
  SP1:"LaLiga",SP2:"LaLiga 2",D1:"Bundesliga",D2:"2. Bundesliga",F1:"Ligue 1",F2:"Ligue 2",
  N1:"Eredivisie",B1:"Pro League",P1:"Primeira Liga",T1:"Süper Lig",G1:"Super League Grecia",
  SC0:"Premiership Scozia","champions-league":"Champions League","europa-league":"Europa League",
  "conference-league":"Conference League"};
const MOTIVI = ["Assenze / infortuni","Formazioni","Notizie","Motivazione","Meteo / campo",
  "Calendario / stanchezza","Altro"];

// chiave del link segreto: #k=...  (ricordata su questo dispositivo)
function leggiChiave(){
  const m = location.hash.match(/k=([0-9a-f]{16,})/i);
  try{
    if(m){localStorage.setItem("registro_k",m[1]);return m[1];}
    return localStorage.getItem("registro_k");
  }catch(e){return m?m[1]:null}
}
const K = leggiChiave();
const H = {apikey:CHIAVE_PUBBLICA,"x-chiave":K||"","Content-Type":"application/json"};

const stato = {vista:"prossime",righe:[],commenti:[],aperti:new Set(),
  filtro:{comp:"",cerca:"",solo:false}};

async function api(percorso, opz={}){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${percorso}`,{...opz,headers:{...H,...(opz.headers||{})}});
  if(!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  const t = await r.text(); return t?JSON.parse(t):null;
}

async function carica(){
  const [righe,commenti] = await Promise.all([
    api("pronostici?select=*&order=data.asc,ora_utc.asc&limit=10000"),
    api("commenti?select=*&order=creato_il.asc&limit=10000")]);
  stato.righe = righe; stato.commenti = commenti;
  const agg = righe.reduce((m,r)=>r.aggiornato_il>m?r.aggiornato_il:m,"");
  document.getElementById("stato").textContent = agg
    ? `Aggiornato il ${new Date(agg).toLocaleString("it-IT",{dateStyle:"medium",timeStyle:"short"})} · ${righe.length} partite`
    : "Nessun dato";
}

const oggi = ()=>new Date().toISOString().slice(0,10);
const pct = v=>v==null?"–":Math.round(v*100)+"%";
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nomeComp = c=>COMPETIZIONI[c]||c;
function giornoIt(d){return new Date(d+"T12:00:00").toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"})}
function oraLocale(r){
  if(!r.ora_utc) return "";
  const d = new Date(`${r.data}T${r.ora_utc}:00Z`);
  return isNaN(d)?r.ora_utc:d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
}

function filtra(righe){
  const f = stato.filtro, q = f.cerca.trim().toLowerCase();
  return righe.filter(r=>(!f.comp||r.competizione===f.comp)
    && (!q||r.casa.toLowerCase().includes(q)||r.ospite.toLowerCase().includes(q))
    && (!f.solo||r.affidabilita==="normale"));
}

function chipEsito(ok){return ok===true?" ok":ok===false?" ko":""}

function card(r){
  const giocata = r.gol_casa!=null;
  const nc = stato.commenti.filter(c=>c.partita_id===r.id);
  const barra = r.p1!=null ? `<div class="barra" title="1 / X / 2">
      <div class="b1" style="flex:${r.p1}">1 ${pct(r.p1)}</div>
      <div class="bx" style="flex:${r.px}">X ${pct(r.px)}</div>
      <div class="b2" style="flex:${r.p2}">2 ${pct(r.p2)}</div></div>` : "";
  const chips = [];
  if(r.pronostico_1x2) chips.push(`<span class="chip${chipEsito(r.ok_1x2)}">1X2 <b>${r.pronostico_1x2}</b> ${pct(r.prob_1x2)}</span>`);
  if(r.pronostico_ou) chips.push(`<span class="chip${chipEsito(r.ok_ou)}"><b>${r.pronostico_ou}</b> ${pct(r.prob_ou)}</span>`);
  if(r.pronostico_goal) chips.push(`<span class="chip dim${chipEsito(r.ok_goal)}" title="Solo indicativo">${r.pronostico_goal} ${pct(r.prob_goal)}*</span>`);
  const avviso = r.affidabilita && r.affidabilita!=="normale" ? `<div class="avviso">⚠︎ Affidabilità ${esc(r.affidabilita)}</div>`:"";
  const aperto = stato.aperti.has(r.id);
  return `<div class="card" id="c-${esc(r.id)}">
    <div class="riga1"><span>${esc(nomeComp(r.competizione))}</span><span>${giocata?"Finita":oraLocale(r)}</span></div>
    <div class="squadre"><span>${esc(r.casa)}</span>${giocata?`<span class="ris">${r.gol_casa} – ${r.gol_ospite}</span>`:""}<span>${esc(r.ospite)}</span></div>
    ${barra}<div class="mercati">${chips.join("")}</div>${avviso}
    <div class="azioni"><button data-apri="${esc(r.id)}">💬 Commenti (${nc.length})</button></div>
    ${aperto?pannello(r,nc):""}</div>`;
}

function pannello(r,nc){
  const lista = nc.map(c=>`<div class="com"><div class="meta">${new Date(c.creato_il).toLocaleString("it-IT",{dateStyle:"short",timeStyle:"short"})}
    · ${esc(c.mercato||"")}${c.pronostico_corretto?` → <b>${esc(c.pronostico_corretto)}</b>`:""}${c.motivo?` · ${esc(c.motivo)}`:""}</div>${esc(c.testo)}</div>`).join("")
    || `<div class="nota">Nessun commento.</div>`;
  return `<div class="commenti">${lista}
    <form class="form" data-form="${esc(r.id)}">
      <select name="mercato"><option>Generale</option><option>1X2</option><option>Over/Under</option><option>Goal</option></select>
      <select name="pronostico_corretto"><option value="">Correzione (facoltativa)</option>
        <option>1</option><option>X</option><option>2</option><option>1X</option><option>X2</option><option>12</option>
        <option>Over 2.5</option><option>Under 2.5</option><option>Goal</option><option>No Goal</option></select>
      <select name="motivo"><option value="">Motivo</option>${MOTIVI.map(m=>`<option>${m}</option>`).join("")}</select>
      <textarea name="testo" maxlength="2000" required placeholder="Cosa sai che i dati non sanno?"></textarea>
      <button type="submit">Salva commento</button>
    </form></div>`;
}

function filtri(righe){
  const comps = [...new Set(righe.map(r=>r.competizione))].sort((a,b)=>nomeComp(a).localeCompare(nomeComp(b)));
  const f = stato.filtro;
  return `<div class="filtri">
    <select id="f-comp"><option value="">Tutte le competizioni</option>${comps.map(c=>`<option value="${esc(c)}"${c===f.comp?" selected":""}>${esc(nomeComp(c))}</option>`).join("")}</select>
    <input id="f-cerca" placeholder="Cerca squadra" value="${esc(f.cerca)}">
    <label><input type="checkbox" id="f-solo"${f.solo?" checked":""}> Solo affidabilità normale</label></div>`;
}

function elenco(righe, ordineInverso){
  if(!righe.length) return `<div class="vuoto">Nessuna partita.</div>`;
  const perGiorno = {};
  righe.forEach(r=>(perGiorno[r.data]??=[]).push(r));
  let giorni = Object.keys(perGiorno).sort(); if(ordineInverso) giorni.reverse();
  return giorni.map(g=>`<div class="giorno">${giornoIt(g)}</div>${perGiorno[g].map(card).join("")}`).join("");
}

function bilancio(righe){
  const giocate = righe.filter(r=>r.gol_casa!=null);
  if(!giocate.length) return `<div class="vuoto">Il bilancio comparirà quando le prime partite pronosticate saranno giocate.</div>`;
  const mercati = [["1X2","ok_1x2","prob_1x2"],["Over/Under 2.5","ok_ou","prob_ou"],["Goal (indicativo)","ok_goal","prob_goal"]];
  const fasce = [[0,.5],[.5,.6],[.6,.7],[.7,1.01]];
  const riga = (nome,rs,ok,pr)=>{const v=rs.filter(r=>r[ok]!=null);if(!v.length)return"";
    const n=v.filter(r=>r[ok]).length;const p=v.reduce((s,r)=>s+r[pr],0)/v.length;
    return `<tr><td>${nome}</td><td>${v.length}</td><td>${pct(n/v.length)}</td><td>${pct(p)}</td></tr>`};
  let html = `<h2>Pronostici indovinati</h2><table><tr><th>Mercato</th><th>Partite</th><th>Indovinati</th><th>Probabilità media</th></tr>
    ${mercati.map(([n,o,p])=>riga(n,giocate,o,p)).join("")}</table>
    <p class="nota">Se “Indovinati” è vicino a “Probabilità media”, le probabilità del modello sono affidabili.</p>`;
  mercati.slice(0,2).forEach(([n,o,p])=>{
    html += `<h2>${n} per fascia di sicurezza</h2><table><tr><th>Probabilità</th><th>Partite</th><th>Indovinati</th><th>Attesi</th></tr>
      ${fasce.map(([a,b])=>riga(`${Math.round(a*100)}–${Math.min(100,Math.round(b*100))}%`,giocate.filter(r=>r[p]>=a&&r[p]<b),o,p)).join("")}</table>`;
  });
  const conCorr = stato.commenti.filter(c=>c.pronostico_corretto);
  if(conCorr.length){
    const per = {};
    conCorr.forEach(c=>{const r=giocate.find(x=>x.id===c.partita_id);if(!r)return;
      const ok = ["1","X","2"].includes(c.pronostico_corretto)?c.pronostico_corretto===r.esito_1x2
        : c.pronostico_corretto==="1X"?r.esito_1x2!=="2":c.pronostico_corretto==="X2"?r.esito_1x2!=="1":c.pronostico_corretto==="12"?r.esito_1x2!=="X"
        : c.pronostico_corretto.startsWith("Over")?r.gol_casa+r.gol_ospite>2:c.pronostico_corretto.startsWith("Under")?r.gol_casa+r.gol_ospite<3
        : c.pronostico_corretto==="Goal"?r.gol_casa>0&&r.gol_ospite>0:!(r.gol_casa>0&&r.gol_ospite>0);
      const m = c.motivo||"Senza motivo"; (per[m]??=[0,0]); per[m][0]++; if(ok) per[m][1]++;});
    const voci = Object.entries(per);
    if(voci.length) html += `<h2>Correzioni ragionate</h2><table><tr><th>Motivo</th><th>Correzioni</th><th>Indovinate</th></tr>
      ${voci.map(([m,[n,k]])=>`<tr><td>${esc(m)}</td><td>${n}</td><td>${pct(k/n)}</td></tr>`).join("")}</table>`;
  }
  return html;
}

function disegna(){
  const main = document.getElementById("main"), oggiS = oggi();
  if(stato.vista==="bilancio"){main.innerHTML = bilancio(stato.righe);return;}
  const base = stato.vista==="prossime"
    ? stato.righe.filter(r=>r.gol_casa==null && r.data>=oggiS)
    : stato.righe.filter(r=>r.gol_casa!=null);
  main.innerHTML = filtri(base) + elenco(filtra(base), stato.vista==="risultati");
}

document.querySelector("nav").addEventListener("click",e=>{
  const v = e.target.dataset.vista; if(!v) return;
  stato.vista = v;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.vista===v));
  disegna(); window.scrollTo(0,0);
});
document.getElementById("main").addEventListener("change",e=>{
  if(e.target.id==="f-comp"){stato.filtro.comp=e.target.value;disegna();}
  if(e.target.id==="f-solo"){stato.filtro.solo=e.target.checked;disegna();}
});
document.getElementById("main").addEventListener("input",e=>{
  if(e.target.id!=="f-cerca") return;
  stato.filtro.cerca=e.target.value; const pos=e.target.selectionStart; disegna();
  const i=document.getElementById("f-cerca"); i.focus(); i.setSelectionRange(pos,pos);
});
document.getElementById("main").addEventListener("click",e=>{
  const id = e.target.dataset.apri; if(!id) return;
  stato.aperti.has(id)?stato.aperti.delete(id):stato.aperti.add(id); disegna();
  document.getElementById("c-"+id)?.scrollIntoView({block:"nearest"});
});
document.getElementById("main").addEventListener("submit",async e=>{
  e.preventDefault();
  const f = e.target, id = f.dataset.form, dati = Object.fromEntries(new FormData(f));
  const btn = f.querySelector("button"); btn.disabled = true; btn.textContent = "Salvataggio…";
  try{
    await api("commenti",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({
      partita_id:id,mercato:dati.mercato,pronostico_corretto:dati.pronostico_corretto||null,
      motivo:dati.motivo||null,testo:dati.testo.trim()})});
    stato.commenti = await api("commenti?select=*&order=creato_il.asc&limit=10000");
    disegna();
  }catch(err){btn.disabled=false;btn.textContent="Riprova";alert("Commento non salvato: "+err.message);}
});

// aprire il link segreto su una pagina gia aperta cambia solo l'hash: ricarichiamo
window.addEventListener("hashchange",()=>location.reload());

(async()=>{
  if(!K){document.getElementById("stato").textContent="";
    document.getElementById("main").innerHTML=`<div class="errore">Apri la pagina dal link segreto.</div>`;return;}
  try{await carica();disegna();}
  catch(err){document.getElementById("main").innerHTML=`<div class="errore">Impossibile caricare i dati.<br><small>${esc(err.message)}</small></div>`;}
})();
</script>
</body>
</html>
